services:
  # ==========================================
  # Frontend Web UI & Backend API (Bun)
  # ==========================================
  web:
    build:
      context: ./src/GZCTF/ClientApp
      dockerfile: Dockerfile
    container_name: gz-ad-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - ./src/GZCTF/ClientApp/build:/app/build:ro
      - ./src/GZCTF/ClientApp/mock-server.ts:/app/mock-server.ts:ro
    networks:
      - gz-network

  # ==========================================
  # Public HTTPS Tunnel (Cloudflare)
  # Instant public HTTPS domain (https://*.trycloudflare.com)
  # Anyone can access without ZeroTier or port-forwarding!
  # ==========================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gz-ad-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    networks:
      - gz-network

  # ==========================================
  # Challenge 1: Cryptography (Playground)
  # ==========================================
  chall-crypto:
    build:
      context: ./challenges/Cryptography/playground/src
      dockerfile: Dockerfile
    container_name: chall-crypto-playground
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    ports:
      - "6969:6969"
    networks:
      - gz-network

  # ==========================================
  # Challenge 2: Binary Exploitation ((C)PPPP!)
  # ==========================================
  chall-pwn:
    build:
      context: ./challenges/Binary Exploitation/(C)PPPP!/source
      dockerfile: Dockerfile
    container_name: chall-pwn-cpppp
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    ports:
      - "7070:7070"
    networks:
      - gz-network

  # ==========================================
  # Challenge 3: Web Exploitation (Classic API)
  # ==========================================
  chall-classic-api:
    build:
      context: ./challenges/Web Exploitation/classic-api/source
      dockerfile: Dockerfile
    container_name: chall-web-classic-api
    restart: unless-stopped
    ports:
      - "1337:1337"
    networks:
      - gz-network

  # ==========================================
  # Challenge 4: Web Exploitation (Coloring)
  # ==========================================
  chall-coloring:
    build:
      context: ./challenges/Web Exploitation/coloring/src
      dockerfile: Dockerfile
    container_name: chall-web-coloring
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - gz-network

networks:
  gz-network:
    driver: bridge
