[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:svc]
command=/bin/bash -c "ulimit -n 1024 && exec socat TCP-LISTEN:6969,reuseaddr,fork EXEC:'python3 -u /app/app.py',pty,stderr"
directory=/app
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
